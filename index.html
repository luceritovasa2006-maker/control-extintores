<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Control General de Extintores</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f4f1;
    color: #222;
}

/* =========================
   ENCABEZADO
========================= */

header {
    background: #b6d7a8;
    padding: 20px;
    text-align: center;
    border-bottom: 3px solid #6aa84f;
}

header h1 {
    margin: 0;
    color: #1f4d1f;
}

header p {
    margin: 7px 0 0;
    color: #365b36;
}


/* =========================
   MENÚ
========================= */

.menu {
    background: white;
    padding: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
    border-bottom: 1px solid #ccc;
}

.menu button {
    border: none;
    background: #38761d;
    color: white;
    padding: 11px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.menu button:hover {
    background: #274e13;
}


/* =========================
   CONTENEDOR
========================= */

.contenedor {
    width: 97%;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.10);
}


/* =========================
   BÚSQUEDA
========================= */

.busqueda {
    margin-bottom: 15px;
}

.busqueda input {
    width: 100%;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 15px;
}


/* =========================
   TABLA
========================= */

.tabla-contenedor {
    overflow-x: auto;
    max-height: 650px;
    overflow-y: auto;
    border: 1px solid #aaa;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1500px;
}

th {
    background: #b6d7a8;
    border: 1px solid #999;
    padding: 10px 8px;
    position: sticky;
    top: 0;
    z-index: 5;
    font-size: 13px;
}

td {
    border: 1px solid #aaa;
    padding: 8px;
    font-size: 13px;
    background: white;
}

tr:nth-child(even) td {
    background: #f8fbf8;
}

tr:hover td {
    background: #e8f3e5;
}


/* =========================
   BOTONES
========================= */

.btn {
    border: none;
    color: white;
    padding: 7px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    margin: 2px;
}

.inspeccionar {
    background: #38761d;
}

.qr {
    background: #674ea7;
}

.btn:hover {
    opacity: .85;
}


/* =========================
   ESTADOS
========================= */

.estado {
    padding: 5px 8px;
    border-radius: 5px;
    font-weight: bold;
    display: inline-block;
}

.vencido {
    background: #f4cccc;
    color: #990000;
}

.proximo {
    background: #fff2cc;
    color: #7f6000;
}

.bueno {
    background: #d9ead3;
    color: #274e13;
}

.sin-revisar {
    background: #eeeeee;
    color: #555;
}


/* =========================
   INFORMACIÓN
========================= */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #edf5e9;
    border-left: 5px solid #6aa84f;
}


/* =========================
   MENSAJE DE ERROR
========================= */

.error {
    display: none;
    margin-bottom: 15px;
    padding: 12px;
    background: #f4cccc;
    color: #990000;
    border-radius: 6px;
}


/* =========================
   CELULAR
========================= */

@media(max-width:700px) {

    header h1 {
        font-size: 21px;
    }

    .contenedor {
        width: 99%;
        padding: 10px;
    }

    .menu {
        flex-wrap: wrap;
    }

    .menu button {
        width: 100%;
    }

}

</style>

</head>


<body>


<!-- =========================
     ENCABEZADO
========================= -->

<header>

<h1>
CONTROL GENERAL DE EXTINTORES
</h1>

<p>
Inventario y control de inspección
</p>

</header>


<!-- =========================
     MENÚ
========================= -->

<div class="menu">

<button
onclick="window.location.href='index.html'">

📋 INVENTARIO

</button>


<button
onclick="window.location.href='codigos-qr.html'">

🔳 CÓDIGOS QR

</button>

</div>


<!-- =========================
     CONTENIDO
========================= -->

<div class="contenedor">


<h2>
Inventario de Extintores
</h2>


<!-- BÚSQUEDA -->

<div class="busqueda">

<input
type="text"
id="buscar"
placeholder="Buscar por número, ubicación, tipo o capacidad..."
onkeyup="buscarExtintor()">

</div>


<!-- MENSAJE DE ERROR -->

<div
id="error"
class="error">
</div>


<!-- TABLA -->

<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>AÑO</th>

<th>MES</th>

<th>FECHA</th>

<th>REVISIÓN</th>

<th>N° EXTINTOR</th>

<th>TIPO AGENTE</th>

<th>TIPO EXTINTOR</th>

<th>CAPACIDAD</th>

<th>ALTURA</th>

<th>MES VENC.</th>

<th>AÑO VENC.</th>

<th>UBICACIÓN</th>

<th>ESTADO</th>

<th>Observación</th>

<th>ACCIONES</th>

</tr>

</thead>


<tbody
id="tablaExtintores">
</tbody>


</table>

</div>


<!-- INFORMACIÓN -->

<div class="info">

<b>
Total de extintores:
</b>

<span
id="total">
0
</span>

<br>
<br>

<b>
Fecha:
</b>

<span
id="fecha">
</span>

</div>


</div>


<!-- =========================
     DATOS
========================= -->

<script src="datos.js"></script>


<script>


/* =====================================================
   VERIFICAR QUE DATOS.JS CARGÓ CORRECTAMENTE
===================================================== */

if (
    typeof extintores === "undefined"
) {

    const error =
        document.getElementById("error");

    error.innerText =
        "❌ No se pudo cargar datos.js. Verifica que datos.js esté en la misma carpeta que index.html.";

    error.style.display =
        "block";

}


/* =====================================================
   MOSTRAR TABLA
===================================================== */

function mostrarTabla() {


    const tabla =
        document.getElementById(
            "tablaExtintores"
        );


    tabla.innerHTML = "";


    if (
        typeof extintores === "undefined"
    ) {

        return;

    }


    extintores.forEach(
        function(ext) {


            /* =========================
               BUSCAR INSPECCIÓN GUARDADA
            ========================= */

            let inspeccion = null;


            try {

                inspeccion =
                    JSON.parse(
                        localStorage.getItem(
                            "inspeccion_" +
                            ext.id
                        )
                    );

            }

            catch(error) {

                inspeccion = null;

            }


            /* =========================
               ESTADO
            ========================= */

            let estado =
                inspeccion
                ? inspeccion.estado
                : "SIN REVISAR";


            let clase =
                "sin-revisar";


            if (
                estado === "VENCIDO"
            ) {

                clase =
                    "vencido";

            }

            else if (
                estado === "PRÓXIMO A VENCER"
            ) {

                clase =
                    "proximo";

            }

            else if (
                estado === "BUENO / AL DÍA"
            ) {

                clase =
                    "bueno";

            }


            /* =========================
               CREAR FILA
            ========================= */

            const fila =
                document.createElement("tr");


            fila.innerHTML = `

                <td>
                    2026
                </td>

                <td>
                    AGOSTO
                </td>

                <td>
                    ${ext.fecha || ""}
                </td>

                <td>
                    ${ext.revision || ""}
                </td>

                <td>
                    <b>
                        ${ext.id}
                    </b>
                </td>

                <td>
                    ${ext.agente || ""}
                </td>

                <td>
                    ${ext.tipo || ""}
                </td>

                <td>
                    ${ext.capacidad || ""}
                </td>

                <td>
                    ${ext.altura || ""}
                </td>

                <td>
                    ${ext.mesVencimiento || ""}
                </td>

                <td>
                    ${ext.anioVencimiento || ""}
                </td>

                <td>
                    ${ext.ubicacion || ""}
                </td>

                <td>

                    <span
                        class="estado ${clase}">

                        ${estado}

                    </span>

                </td>

                <td>

                    <button
                        class="btn inspeccionar"
                        onclick="abrirInspeccion(${ext.id})">

                        🔎 Inspeccionar

                    </button>

                    <br>

                    <button
                        class="btn qr"
                        onclick="abrirQR(${ext.id})">

                        🔳 Ver QR

                    </button>

                </td>

            `;


            tabla.appendChild(fila);


        }
    );


    /* =========================
       TOTAL
    ========================= */

    document.getElementById(
        "total"
    ).innerText =
        extintores.length;

}


/* =====================================================
   ABRIR INSPECCIÓN
===================================================== */

function abrirInspeccion(id) {

    window.location.href =
        "inspeccion.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   ABRIR QR
===================================================== */

function abrirQR(id) {

    window.location.href =
        "codigos-qr.html?id=" +
        encodeURIComponent(id);

}


/* =====================================================
   BUSCAR EXTINTOR
===================================================== */

function buscarExtintor() {


    const texto =
        document
        .getElementById("buscar")
        .value
        .toLowerCase()
        .trim();


    const filas =
        document.querySelectorAll(
            "#tablaExtintores tr"
        );


    filas.forEach(
        function(fila) {


            const contenido =
                fila.innerText
                .toLowerCase();


            if (
                contenido.includes(texto)
            ) {

                fila.style.display =
                    "";

            }

            else {

                fila.style.display =
                    "none";

            }

        }
    );

}


/* =====================================================
   MOSTRAR FECHA ACTUAL
===================================================== */

document.getElementById(
    "fecha"
).innerText =
    new Date().toLocaleDateString(
        "es-CO"
    );


/* =====================================================
   CARGAR TABLA
===================================================== */

mostrarTabla();

</script>


</body>

</html>
